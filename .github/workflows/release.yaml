name: Release

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -V -ntp clean package

      - name: Publish the GitHub release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" --clobber \
            "target/components/packages/vinted-kafka-connect-vespa-$VERSION.zip" \
            "target/components/kafka-connect-vespa-$VERSION.jar"

  bump:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Point pom.xml and README.md past the release
        run: |
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"
          mvn -B -ntp versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          sed -E -i \
            -e "s#releases/download/v[0-9][^/]*/#releases/download/$TAG/#g" \
            -e "s#vinted-kafka-connect-vespa-v?[0-9][0-9A-Za-z.-]*\.zip#vinted-kafka-connect-vespa-$VERSION.zip#g" \
            README.md

      - name: Open a pull request
        run: |
          BRANCH="release/$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -am "chore: start $NEXT development after $TAG"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" \
            --title "chore: start $NEXT development after $TAG" \
            --body "$TAG is released. This points README.md at its package and moves pom.xml to $NEXT."
